[package]
name = "clubbench"
version = "0.1.0"
edition = "2021"
description = "ClubBench environment: headless deterministic football-management agent interface + baselines"

[dependencies]
domain = { path = "../domain" }
ofm_core = { path = "../ofm_core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
clap = { version = "4", features = ["derive"] }
